name: Keyulife interface build
on:
  push:
    branches: [feat/keyulife-interface]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install Chinese fonts for UI evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Resolve packages
        working-directory: frontend
        run: flutter pub get
      - name: Analyze
        working-directory: frontend
        run: flutter analyze
      - name: Verify behavior and responsive home
        working-directory: frontend
        run: flutter test
      - name: Build same-origin web application
        working-directory: frontend
        run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none
      - name: Verify compiled account login, purge and recovery
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --no-package-lock playwright@1.59.0
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          export CHROMIUM="$(command -v google-chrome)"
          PYTHONPATH=../backend python3 test_web/serve_fixture.py build/web > "$RUNNER_TEMP/fixture.log" &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            test ! -s "$RUNNER_TEMP/fixture.log" || break
            sleep 1
          done
          node test_web/account_sync.cjs "$(head -n 1 "$RUNNER_TEMP/fixture.log")"
      - name: Package verified web interface
        run: |
          cd frontend/build/web
          zip -qr ../../../keyulife-interface.zip .
          cd ../../..
          sha256sum keyulife-interface.zip > keyulife-interface.zip.sha256
      - name: Prepare pinned server updater
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          sha = hashlib.sha256(Path('keyulife-interface.zip').read_bytes()).hexdigest()
          tag = 'keyulife-interface-' + os.environ['GITHUB_SHA'][:12]
          script = Path('backend/update-interface.sh').read_text()
          Path('update-interface.sh').write_text(script.replace('@RELEASE_TAG@', tag).replace('@SHA256@', sha))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-review
          path: frontend/build/interface-review/
      - uses: actions/upload-artifact@v4
        with:
          name: keyulife-interface
          path: |
            keyulife-interface.zip
            keyulife-interface.zip.sha256
      - name: Publish review build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="keyulife-interface-${GITHUB_SHA:0:12}"
          gh release create "$tag" keyulife-interface.zip keyulife-interface.zip.sha256 update-interface.sh \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title '课屿界面改版 · review build' \
            --notes 'Responsive dashboard and navigation. Frontend files only; no account data or server secrets. Run the matching update script on your server to apply.'
