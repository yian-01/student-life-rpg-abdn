name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Install fonts for UI review
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Run tests
        run: flutter test

      - name: Upload mobile UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-review
          path: frontend/build/ui-review/*.png
          if-no-files-found: warn
