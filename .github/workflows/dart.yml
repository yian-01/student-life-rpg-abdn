name: Flutter CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, "feat/**", "fix/**" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Check formatting
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Install fonts for UI review
        continue-on-error: ${{ github.ref == 'refs/heads/fix/v1-base-regression' || github.ref == 'refs/heads/fix/v1-feature-delivery' || github.ref == 'refs/heads/feat/v1.1-cloud-sync' }}
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Run tests
        env:
          CAMPUS_SYNC_E2E: '1'
        run: flutter test

      - name: Run cloud server tests
        working-directory: backend
        run: python3 -m unittest -v test_sync_server

      - name: Upload mobile UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-review
          path: frontend/build/ui-review/*.png
          if-no-files-found: warn
